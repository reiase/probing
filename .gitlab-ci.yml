# Requires a Linux runner with Docker or Kubernetes executor support.
workflow:
  rules:
    - if: '$CI_COMMIT_TAG'
    - when: never

stages:
  - test
  - package
  - verify
  - release

default:
  image: rust:bookworm

variables:
  CARGO_HOME: "$CI_PROJECT_DIR/.cargo-home"
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  PIP_INDEX_URL: "https://mirrors.aliyun.com/pypi/simple/"
  CARGO_TERM_COLOR: "never"
  PYO3_PYTHON: "/usr/bin/python3"

.rust-build:
  cache:
    key:
      files:
        - Cargo.lock
      prefix: gitlab-cargo
    paths:
      - .cargo-home/registry/
      - .cargo-home/git/
      - .cargo-home/bin/
      - .cargo-home/.crates.toml
      - .cargo-home/.crates2.json
      - .cache/pip/
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends build-essential pkg-config libssl-dev libunwind-dev liblzma-dev python3-dev ca-certificates curl
    - mkdir -p "$CARGO_HOME"
    - |
      cat > "$CARGO_HOME/config.toml" <<'EOF'
      [source.crates-io]
      replace-with = "rsproxy-sparse"

      [source.rsproxy-sparse]
      registry = "sparse+https://rsproxy.cn/index/"
      EOF
    # Match the local toolchain: newer nightlies reject rustix 0.37.28's
    # internal rustc_layout_scalar_valid_range_* attributes.
    - rustup toolchain install nightly-2025-05-09 --profile minimal --target wasm32-unknown-unknown
    - rustup default nightly-2025-05-09
    - export PATH="$CARGO_HOME/bin:$PATH"
    - cargo install --locked trunk --version 0.21.13

test:
  extends: .rust-build
  stage: test
  script:
    - cargo install --locked cargo-nextest --version 0.9.101
    # The server embeds app/dist at compile time.
    - make app/dist
    - make test

package:
  extends: .rust-build
  stage: package
  script:
    # The Makefile targets x86_64 Linux with glibc 2.17.
    - test "$(uname -m)" = x86_64
    - apt-get install -y --no-install-recommends python3-venv binutils
    - python3 -m venv .venv-build
    - . .venv-build/bin/activate
    - python -m pip install --timeout 300 --retries 10 wheel==0.45.1 toml==0.10.2 ziglang==0.13.0
    - cargo install --locked cargo-zigbuild --version 0.20.0
    - export CARGO_ZIGBUILD_ZIG_PATH="$(python -c 'import pathlib, ziglang; print(pathlib.Path(ziglang.__file__).parent / "zig")')"
    - make ZIG=1 wheel
  artifacts:
    name: "probing-${CI_COMMIT_TAG}-linux-x86_64"
    paths:
      - dist/*.whl
    expire_in: 30 days

verify-wheel:
  stage: verify
  image: python:3.11-slim-bookworm
  needs:
    - job: package
      artifacts: true
  script:
    - python -m venv /tmp/probing-wheel-check
    - . /tmp/probing-wheel-check/bin/activate
    - python -m pip install dist/*.whl
    - python -m pip check
    # Avoid importing from the checkout instead of the installed wheel.
    - cd /tmp
    - python -I -c 'import probing; from importlib.metadata import version; print(version("probing")); print(probing.__file__)'
    - probing --help
    - probing --version

publish-release:
  stage: release
  image: python:3.11-slim-bookworm
  needs:
    - job: package
      artifacts: true
    - job: verify-wheel
      artifacts: false
  script:
    - |
      python - <<'PY'
      import json
      import os
      import pathlib
      import urllib.error
      import urllib.parse
      import urllib.request

      api_url = os.environ["CI_API_V4_URL"]
      project_id = os.environ["CI_PROJECT_ID"]
      tag = os.environ["CI_COMMIT_TAG"]
      job_token = os.environ["CI_JOB_TOKEN"]
      pipeline_url = os.environ["CI_PIPELINE_URL"]
      assets = sorted(pathlib.Path("dist").glob("*.whl"))
      if len(assets) != 1:
          raise SystemExit(f"expected one wheel, found: {assets}")

      headers = {"JOB-TOKEN": job_token}

      def request(method, url, *, payload=None, data=None, content_type=None, allowed=(200, 201), read_body=True):
          request_headers = dict(headers)
          if payload is not None:
              data = json.dumps(payload).encode()
              request_headers["Content-Type"] = "application/json"
          elif content_type is not None:
              request_headers["Content-Type"] = content_type
          req = urllib.request.Request(url, data=data, headers=request_headers, method=method)
          try:
              with urllib.request.urlopen(req, timeout=120) as response:
                  body = response.read() if read_body else b""
                  status = response.status
          except urllib.error.HTTPError as exc:
              body = exc.read()
              status = exc.code
          if status not in allowed:
              raise RuntimeError(f"{method} {url} failed with HTTP {status}: {body.decode(errors='replace')}")
          return status, body

      encoded_tag = urllib.parse.quote(tag, safe="")
      wheel = assets[0]
      asset_url = (
          f"{api_url}/projects/{project_id}/packages/generic/probing/"
          f"{encoded_tag}/{urllib.parse.quote(wheel.name, safe='')}"
      )
      status, _ = request("GET", asset_url, allowed=(200, 404), read_body=False)
      if status == 404:
          request(
              "PUT",
              asset_url,
              data=wheel.read_bytes(),
              content_type="application/octet-stream",
          )
          print(f"uploaded wheel: {wheel.name}")
      else:
          print(f"wheel already exists: {wheel.name}")

      release_url = f"{api_url}/projects/{project_id}/releases/{encoded_tag}"
      status, _ = request("GET", release_url, allowed=(200, 404))
      release_payload = {
          "name": f"Probing {tag}",
          "tag_name": tag,
          "description": f"Automated release for {tag}. Built and tested by pipeline {pipeline_url}.",
      }
      if status == 404:
          request("POST", f"{api_url}/projects/{project_id}/releases", payload=release_payload)
          print(f"created release: {tag}")
      else:
          request(
              "PUT",
              release_url,
              payload={"name": release_payload["name"], "description": release_payload["description"]},
          )
          print(f"updated release: {tag}")

      links_url = f"{release_url}/assets/links"
      _, body = request("GET", links_url)
      existing_links = {link["name"]: link for link in json.loads(body)}
      link_payload = {"name": wheel.name, "url": asset_url, "link_type": "package"}
      existing_link = existing_links.get(wheel.name)
      if existing_link is None:
          request("POST", links_url, payload=link_payload)
          print(f"created release asset link: {wheel.name}")
      else:
          request("PUT", f"{links_url}/{existing_link['id']}", payload=link_payload)
          print(f"updated release asset link: {wheel.name}")
      PY
